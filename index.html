<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b25"><title>Gather & Flame | Cook. Create. Entertain.</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7eee0;background:#12231f}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:#172b25;border-bottom:1px solid #405147}h1{margin:0;color:#e9b77c;font-family:Georgia,serif;letter-spacing:1px}h2{font-family:Georgia,serif;color:#f4d3a8}p{line-height:1.55;color:#c6cfc7}nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 5%;background:#192e27}button,.btn{background:#c98c53;color:#17231c;border:0;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}nav button{background:#30443a;color:#fff}nav button.active{background:#d39b64;color:#15251d}main{max-width:1150px;margin:auto;padding:24px 5% 80px}.hero{background:linear-gradient(110deg,#284637,#192e28);padding:32px;border-radius:18px}.hero h2{font-size:clamp(27px,5vw,48px);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}.card{background:#20372e;border:1px solid #3e5748;border-radius:15px;padding:20px}.card h3{color:#eac090;margin:0 0 10px}input,textarea,select{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #66806d;border-radius:9px;background:#14271f;color:#fff;font:inherit}label{display:block;font-weight:650;margin-top:8px}.muted{color:#adbbb0;font-size:14px}.tag{display:inline-block;background:#3a5142;border-radius:20px;padding:5px 9px;color:#f3d4a7;font-size:12px}.hidden{display:none}ul{line-height:1.9}footer{text-align:center;padding:25px;color:#9baea1}a{color:#f1be87} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}
</style></head><body><header><div><h1>🔥 Gather & Flame</h1><small>COOK · CREATE · ENTERTAIN</small></div><span class="tag">Public preview</span></header><nav id="nav"></nav><main id="app"></main><footer>Gather & Flame · Made for memorable meals and good company</footer>
<script>
const tabs=['Discover','Recipes','Burger Lab','Party Planner','Pizza Calculator','Cocktail Bar','My Kitchen'];
const recipes=[
['The Dirty Double','Burgers','Chuck, brisket and short rib smash burger with American cheese, bacon, pickles, onions and house sauce.','150g beef blend (50% chuck, 25% brisket, 25% short rib); American cheese; smoked bacon; dill pickles; caramelised onions; brioche bun. Sauce: 2 tbsp mayo, 1 tbsp ketchup, 1 tsp mustard, 1 tsp pickle juice, garlic powder, smoked paprika.'],
['The Pepper Punisher','Burgers','Peppercorn steakhouse smash burger with mushrooms, cheddar and crispy shallots.','150g 50/25/25 beef blend; mature cheddar; mushrooms; onions; shallots. Sauce: 2 tbsp cream, 1 tsp Dijon, 1 tsp peppercorns, 1 tsp beef stock.'],
['The Truffle Trouble','Burgers','Swiss cheese, garlic mushrooms, crispy shallots, rocket and truffle mayo.','150g 50/25/25 beef blend; Swiss cheese; mushrooms; shallots; rocket. Sauce: 2 tbsp mayo, 1/4 tsp truffle oil, lemon, Parmesan.'],
['The Smoke Show','Burgers','Smoked cheddar, brisket burnt ends, pickled red onion and BBQ glaze.','150g 50/25/25 beef blend; smoked cheddar; 60g cooked burnt ends; pickled onion; crispy onions. Sauce: BBQ sauce, brown sugar, smoked paprika, cider vinegar.'],
['The Seoul Destroyer','Burgers','Gochujang mayo, sesame slaw and pickled cucumber.','150g 50/25/25 beef blend; American cheese; sesame slaw; cucumber; crispy onions. Sauce: mayo, gochujang, honey, soy, rice vinegar, sesame oil.'],
['The Blue Beast','Burgers','Blue cheese, bacon jam, rocket and roasted garlic mayo.','150g 50/25/25 beef blend; Stilton; bacon-onion jam; rocket; bacon; roasted garlic mayo.'],
['The Sweet Heat Freak','Burgers','Hot honey, candied jalapeños, bacon and chipotle mayo.','150g 50/25/25 beef blend; American cheese; jalapeños; bacon; pickles; chipotle mayo; hot honey.'],
['The Morning After','Burgers','Breakfast smash burger with maple bacon, hash brown and fried egg.','150g 50/25/25 beef blend; American cheese; maple bacon; hash brown; egg; onions; maple-chipotle mayo.'],
['The Surf Monster','Burgers','Beef and salmon patty with prawns, cheddar and lemon dill mayo.','80g chuck, 35g brisket, 35g short rib, 35g skinless salmon; cheddar; bacon; cooked king prawns; pickled onion; shallots; lettuce; lemon dill mayo. Cook mixed patty thoroughly to 75°C core.'],
['The Bone Crusher','Burgers','Rich oxtail and marrow beef burger with bone-marrow peppercorn sauce.','50g chuck, 30g brisket, 30g short rib, 20g cooked boneless oxtail, 20g edible marrow; cheddar; mushrooms; onions; shallots; rocket; peppercorn sauce.'],
["Scottie's House Rub",'BBQ & Smokers','A sweet, smoky all-round BBQ rub for 1kg of meat.','25g brown sugar; 15g smoked paprika; 10g sweet paprika; 8g garlic; 8g onion; 6g pepper; 5g mustard; 3g cumin; 2g chilli; 8g salt.'],
['Texas Beef Rub','BBQ & Smokers','Pepper-forward seasoning for beef and brisket.','18g coarse pepper; 15g salt; 8g garlic; 6g onion; 5g smoked paprika; 3g mustard.'],
['Garlic & Herb Marinade','Indoor Cooking','Bright herb marinade for chicken and vegetables.','40ml olive oil; 4 garlic cloves; rosemary; thyme; parsley; lemon zest and juice; Dijon; salt and pepper. Refrigerate while marinating.'],
['Classic Pizza Dough','Pizza Oven','Simple dough for a homemade pizza night.','Flour, water, salt and yeast. Use the pizza calculator for quantities.'],
['Sharing Nachos','Appetisers','Easy crowd-pleaser for movie nights and parties.','Tortilla chips; grated cheese; jalapeños; salsa; sour cream; spring onions. Bake until cheese melts.'],
['Mojito','Cocktails','Refreshing lime, mint and rum cocktail.','50ml white rum; 25ml lime juice; 2 tsp sugar; mint; soda water; crushed ice. Adults only.'],
['Espresso Martini','Cocktails','Coffee-forward after-dinner cocktail.','50ml vodka; 25ml coffee liqueur; 25ml fresh espresso; ice. Adults only.']
];
const $=s=>document.querySelector(s);let tab='Discover';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saved(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function nav(){ $('#nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" data-tab="'+safe(t)+'">'+safe(t)+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function recipeCards(items){return '<div class="grid">'+items.map((r)=>'<article class="card"><span class="tag">'+safe(r[1])+'</span><h3>'+safe(r[0])+'</h3><p>'+safe(r[2])+'</p><details><summary>Ingredients & instructions</summary><p>'+safe(r[3])+'</p><p class="muted">Follow safe food handling and cook to appropriate temperatures.</p></details><p><button data-save="'+safe(r[0])+'">♡ Save recipe</button></p></article>').join('')+'</div>'}
function bindSave(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let f=saved('gf-favourites',[]);if(!f.includes(b.dataset.save))f.push(b.dataset.save);store('gf-favourites',f);b.textContent='✓ Saved'})}
function render(){nav();let html='';
if(tab==='Discover')html='<section class="hero"><h2>Good food. Great company. Anywhere.</h2><p>From indoor dinner parties to BBQ weekends, smoking sessions, pizza nights and cocktails — discover recipes and plan the occasion.</p><button id="browse">Explore recipes</button></section><h2>What are we cooking?</h2><div class="grid">'+['Burgers','BBQ & Smokers','Indoor Cooking','Pizza Oven','Appetisers','Cocktails'].map(c=>'<div class="card"><h3>'+c+'</h3><p>Explore ideas for '+c.toLowerCase()+'.</p><button data-category="'+c+'">Explore</button></div>').join('')+'</div>';
if(tab==='Recipes')html='<h2>Recipe collection</h2><input id="search" placeholder="Search recipes, ingredients or cooking styles"><div id="results">'+recipeCards(recipes)+'</div>';
if(tab==='Burger Lab')html='<h2>Scottie’s Signature Burger Lab</h2><p>Ten signature burgers, including Surf Monster and Bone Crusher. For standard burgers, start with 50% chuck, 25% brisket and 25% short rib.</p>'+recipeCards(recipes.filter(r=>r[1]==='Burgers'));
if(tab==='Cocktail Bar')html='<h2>Cocktail Bar</h2><p>Mix drinks for your next get-together. Alcoholic recipes are for adults.</p>'+recipeCards(recipes.filter(r=>r[1]==='Cocktails'));
if(tab==='Pizza Calculator')html='<h2>Pizza Dough Calculator</h2><div class="card"><label>Number of pizzas<input id="count" type="number" min="1" max="100" value="4"></label><label>Dough ball weight (g)<input id="weight" type="number" min="100" max="1000" value="250"></label><label>Hydration (%)<input id="hydration" type="number" min="50" max="85" value="65"></label><button id="calculate">Calculate ingredients</button><div id="calc"></div></div>';
if(tab==='Party Planner')html='<h2>Party Planner</h2><p>Create a simple event checklist on this device.</p><div class="card"><label>Event name<input id="event" placeholder="Saturday BBQ"></label><label>Guests<input id="guests" type="number" min="1" value="10"></label><label>Menu ideas<textarea id="menu" rows="4" placeholder="Burgers, pizza, salads..."></textarea></label><label>Shopping list (one item per line)<textarea id="shopping" rows="6"></textarea></label><button id="saveparty">Save plan</button><p id="partymsg" class="muted"></p></div>';
if(tab==='My Kitchen'){let fav=saved('gf-favourites',[]);html='<h2>My Kitchen</h2><p class="muted">Private to this browser only. Cloud accounts for Scott and Nicky have not yet been set up. Do not store sensitive information here.</p><h3>Saved recipes</h3>'+recipeCards(recipes.filter(r=>fav.includes(r[0])))+'<div class="card"><h3>My cooking notes</h3><textarea id="notes" rows="7" placeholder="Ideas, recipe tweaks and cooking notes...">'+safe(saved('gf-notes',''))+'</textarea><button id="savenotes">Save notes on this device</button></div>'}
$('#app').innerHTML=html;bindSave();
if(tab==='Discover'){ $('#browse').onclick=()=>{tab='Recipes';render()};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{tab=b.dataset.category==='Burgers'?'Burger Lab':b.dataset.category==='Cocktails'?'Cocktail Bar':'Recipes';render();if(tab==='Recipes'){ $('#search').value=b.dataset.category;$('#search').dispatchEvent(new Event('input'))}})}
if(tab==='Recipes')$('#search').oninput=e=>{let q=e.target.value.toLowerCase();$('#results').innerHTML=recipeCards(recipes.filter(r=>r.join(' ').toLowerCase().includes(q)));bindSave()};
if(tab==='Pizza Calculator'){let calc=()=>{let n=Math.max(1,Number($('#count').value)||4),w=Math.max(100,Number($('#weight').value)||250),h=Math.max(50,Number($('#hydration').value)||65)/100;let flour=n*w/(1+h+.028);$('#calc').innerHTML='<h3>For '+n+' pizzas</h3><ul><li>Flour: '+Math.round(flour)+'g</li><li>Water: '+Math.round(flour*h)+'g</li><li>Salt: '+Math.round(flour*.025)+'g</li><li>Instant yeast: '+(flour*.003).toFixed(1)+'g</li></ul><p class="muted">Approximate dough formula; fermentation time and yeast amount depend on temperature.</p>'};$('#calculate').onclick=calc;calc()}
if(tab==='Party Planner'){let p=saved('gf-party',{});['event','guests','menu','shopping'].forEach(k=>{if(p[k])$('#'+k).value=p[k]});$('#saveparty').onclick=()=>{let v={};['event','guests','menu','shopping'].forEach(k=>v[k]=$('#'+k).value);store('gf-party',v);$('#partymsg').textContent='Saved on this device ✓'}}
if(tab==='My Kitchen')$('#savenotes').onclick=()=>{store('gf-notes',$('#notes').value);alert('Notes saved on this device')};
}render();
</script></body></html>
