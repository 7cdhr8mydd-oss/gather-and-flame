<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b25"><title>Gather & Flame | Cook. Create. Entertain.</title>
<style>

</style></head><body><header><div><h1>🔥 Gather & Flame</h1><small>COOK · CREATE · ENTERTAIN</small></div><span class="tag">Public preview</span></header><nav id="nav"></nav><main id="app"></main><footer>Gather & Flame · Made for memorable meals and good company</footer>
<script>
const tabs=['Discover','Recipes','Burger Lab','Party Planner','Pizza Calculator','Cocktail Bar','My Kitchen'];
const recipes=[
['The Dirty Double','Burgers','Chuck, brisket and short rib smash burger with American cheese, bacon, pickles, onions and house sauce.','150g beef blend (50% chuck, 25% brisket, 25% short rib); American cheese; smoked bacon; dill pickles; caramelised onions; brioche bun. Sauce: 2 tbsp mayo, 1 tbsp ketchup, 1 tsp mustard, 1 tsp pickle juice, garlic powder, smoked paprika.'],
['The Pepper Punisher','Burgers','Peppercorn steakhouse smash burger with mushrooms, cheddar and crispy shallots.','150g 50/25/25 beef blend; mature cheddar; mushrooms; onions; shallots. Sauce: 2 tbsp cream, 1 tsp Dijon, 1 tsp peppercorns, 1 tsp beef stock.'],
['The Truffle Trouble','Burgers','Swiss cheese, garlic mushrooms, crispy shallots, rocket and truffle mayo.','150g 50/25/25 beef blend; Swiss cheese; mushrooms; shallots; rocket. Sauce: 2 tbsp mayo, 1/4 tsp truffle oil, lemon, Parmesan.'],
['The Smoke Show','Burgers','Smoked cheddar, brisket burnt ends, pickled red onion and BBQ glaze.','150g 50/25/25 beef blend; smoked cheddar; 60g cooked burnt ends; pickled onion; crispy onions. Sauce: BBQ sauce, brown sugar, smoked paprika, cider vinegar.'],
['The Seoul Destroyer','Burgers','Gochujang mayo, sesame slaw and pickled cucumber.','150g 50/25/25 beef blend; American cheese; sesame slaw; cucumber; crispy onions. Sauce: mayo, gochujang, honey, soy, rice vinegar, sesame oil.'],
['The Blue Beast','Burgers','Blue cheese, bacon jam, rocket and roasted garlic mayo.','150g 50/25/25 beef blend; Stilton; bacon-onion jam; rocket; bacon; roasted garlic mayo.'],
['The Sweet Heat Freak','Burgers','Hot honey, candied jalapeños, bacon and chipotle mayo.','150g 50/25/25 beef blend; American cheese; jalapeños; bacon; pickles; chipotle mayo; hot honey.'],
['The Morning After','Burgers','Breakfast smash burger with maple bacon, hash brown and fried egg.','150g 50/25/25 beef blend; American cheese; maple bacon; hash brown; egg; onions; maple-chipotle mayo.'],
['The Surf Monster','Burgers','Beef and salmon patty with prawns, cheddar and lemon dill mayo.','80g chuck, 35g brisket, 35g short rib, 35g skinless salmon; cheddar; bacon; cooked king prawns; pickled onion; shallots; lettuce; lemon dill mayo. Cook mixed patty thoroughly to 75°C core.'],
['The Bone Crusher','Burgers','Rich oxtail and marrow beef burger with bone-marrow peppercorn sauce.','50g chuck, 30g brisket, 30g short rib, 20g cooked boneless oxtail, 20g edible marrow; cheddar; mushrooms; onions; shallots; rocket; peppercorn sauce.'],
["Scottie's House Rub",'BBQ & Smokers','A sweet, smoky all-round BBQ rub for 1kg of meat.','25g brown sugar; 15g smoked paprika; 10g sweet paprika; 8g garlic; 8g onion; 6g pepper; 5g mustard; 3g cumin; 2g chilli; 8g salt.'],
['Texas Beef Rub','BBQ & Smokers','Pepper-forward seasoning for beef and brisket.','18g coarse pepper; 15g salt; 8g garlic; 6g onion; 5g smoked paprika; 3g mustard.'],
['Garlic & Herb Marinade','Indoor Cooking','Bright herb marinade for chicken and vegetables.','40ml olive oil; 4 garlic cloves; rosemary; thyme; parsley; lemon zest and juice; Dijon; salt and pepper. Refrigerate while marinating.'],
['Classic Pizza Dough','Pizza Oven','Simple dough for a homemade pizza night.','Flour, water, salt and yeast. Use the pizza calculator for quantities.'],
['Sharing Nachos','Appetisers','Easy crowd-pleaser for movie nights and parties.','Tortilla chips; grated cheese; jalapeños; salsa; sour cream; spring onions. Bake until cheese melts.'],
['Mojito','Cocktails','Refreshing lime, mint and rum cocktail.','50ml white rum; 25ml lime juice; 2 tsp sugar; mint; soda water; crushed ice. Adults only.'],

];
const $=s=>document.querySelector(s);let tab='Discover';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saved(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function nav(){ $('#nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" data-tab="'+safe(t)+'">'+safe(t)+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function recipeCards(items){return '<div class="grid">'+items.map((r)=>'<article class="card"><span class="tag">'+safe(r[1])+'</span><h3>'+safe(r[0])+'</h3><p>'+safe(r[2])+'</p><details><summary>Ingredients & instructions</summary><p>'+safe(r[3])+'</p><p class="muted">Follow safe food handling and cook to appropriate temperatures.</p></details><p><button data-save="'+safe(r[0])+'">♡ Save recipe</button></p></article>').join('')+'</div>'}
function bindSave(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let f=saved('gf-favourites',[]);if(!f.includes(b.dataset.save))f.push(b.dataset.save);store('gf-favourites',f);b.textContent='✓ Saved'})}
function render(){nav();let html='';
if(tab==='Discover')html='<section class="hero"><h2>Good food. Great company. Anywhere.</h2><p>From indoor dinner parties to BBQ weekends, smoking sessions, pizza nights and cocktails — discover recipes and plan the occasion.</p><button id="browse">Explore recipes</button></section><h2>What are we cooking?</h2><div class="grid">'+['Burgers','BBQ & Smokers','Indoor Cooking','Pizza Oven','Appetisers','Cocktails'].map(c=>'<div class="card"><h3>'+c+'</h3><p>Explore ideas for '+c.toLowerCase()+'.</p><button data-category="'+c+'">Explore</button></div>').join('')+'</div>';
if(tab==='Recipes')html='<h2>Recipe collection</h2><input id="search" placeholder="Search recipes, ingredients or cooking styles"><div id="results">'+recipeCards(recipes)+'</div>';
if(tab==='Burger Lab')html='<h2>Scottie’s Signature Burger Lab</h2><p>Ten signature burgers, including Surf Monster and Bone Crusher. For standard burgers, start with 50% chuck, 25% brisket and 25% short rib.</p>'+recipeCards(recipes.filter(r=>r[1]==='Burgers'));
if(tab==='Cocktail Bar')html='<h2>Cocktail Bar</h2><p>Mix drinks for your next get-together. Alcoholic recipes are for adults.</p>'+recipeCards(recipes.filter(r=>r[1]==='Cocktails'));
if(tab==='Pizza Calculator')html='<h2>Pizza Dough Calculator</h2><div class="card"><label>Number of pizzas<input id="count" type="number" min="1" max="100" value="4"></label><label>Dough ball weight (g)<input id="weight" type="number" min="100" max="1000" value="250"></label><label>Hydration (%)<input id="hydration" type="number" min="50" max="85" value="65"></label><button id="calculate">Calculate ingredients</button><div id="calc"></div></div>';
if(tab==='Party Planner')html='<h2>Party Planner</h2><p>Create a simple event checklist on this device.</p><div class="card"><label>Event name<input id="event" placeholder="Saturday BBQ"></label><label>Guests<input id="guests" type="number" min="1" value="10"></label><label>Menu ideas<textarea id="menu" rows="4" placeholder="Burgers, pizza, salads..."></textarea></label><label>Shopping list (one item per line)<textarea id="shopping" rows="6"></textarea></label><button id="saveparty">Save plan</button><p id="partymsg" class="muted"></p></div>';
if(tab==='My Kitchen'){let fav=saved('gf-favourites',[]);html='<h2>My Kitchen</h2><p class="muted">Private to this browser only. Cloud accounts for Scott and Nicky have not yet been set up. Do not store sensitive information here.</p><h3>Saved recipes</h3>'+recipeCards(recipes.filter(r=>fav.includes(r[0])))+'<div class="card"><h3>My cooking notes</h3><textarea id="notes" rows="7" placeholder="Ideas, recipe tweaks and cooking notes...">'+safe(saved('gf-notes',''))+'</textarea><button id="savenotes">Save notes on this device</button></div>'}
$('#app').innerHTML=html;bindSave();
if(tab==='Discover'){ $('#browse').onclick=()=>{tab='Recipes';render()};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{tab=b.dataset.category==='Burgers'?'Burger Lab':b.dataset.category==='Cocktails'?'Cocktail Bar':'Recipes';render();if(tab==='Recipes'){ $('#search').value=b.dataset.category;$('#search').dispatchEvent(new Event('input'))}})}
if(tab==='Recipes')$('#search').oninput=e=>{let q=e.target.value.toLowerCase();$('#results').innerHTML=recipeCards(recipes.filter(r=>r.join(' ').toLowerCase().includes(q)));bindSave()};
if(tab==='Pizza Calculator'){let calc=()=>{let n=Math.max(1,Number($('#count').value)||4),w=Math.max(100,Number($('#weight').value)||250),h=Math.max(50,Number($('#hydration').value)||65)/100;let flour=n*w/(1+h+.028);$('#calc').innerHTML='<h3>For '+n+' pizzas</h3><ul><li>Flour: '+Math.round(flour)+'g</li><li>Water: '+Math.round(flour*h)+'g</li><li>Salt: '+Math.round(flour*.025)+'g</li><li>Instant yeast: '+(flour*.003).toFixed(1)+'g</li></ul><p class="muted">Approximate dough formula; fermentation time and yeast amount depend on temperature.</p>'};$('#calculate').onclick=calc;calc()}
if(tab==='Party Planner'){let p=saved('gf-party',{});['event','guests','menu','shopping'].forEach(k=>{if(p[k])$('#'+k).value=p[k]});$('#saveparty').onclick=()=>{let v={};['event','guests','menu','shopping'].forEach(k=>v[k]=$('#'+k).value);store('gf-party',v);$('#partymsg').textContent='Saved on this device ✓'}}
if(tab==='My Kitchen')$('#savenotes').onclick=()=>{store('gf-notes',$('#notes').value);alert('Notes saved on this device')};
}render();
</script>
<script>
/* Gather & Flame burger recipes and event quantity calculator */
const burgerSpecs=[
{name:"The Dirty Double",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["American cheese slices",2,"each"],["Smoked streaky bacon",2,"rashers"],["Dill pickle slices",3,"each"],["Caramelised onions",30,"g"],["Mayonnaise",30,"ml"],["Ketchup",15,"ml"],["American mustard",5,"ml"],["Pickle juice",5,"ml"],["Garlic powder",0.3,"g"],["Smoked paprika",0.3,"g"]],method:"Form two 75g beef balls, season the outside and smash on a very hot griddle. Cook thoroughly, add cheese, then assemble with crisp bacon, pickles, onions and the mixed house sauce."},
{name:"The Pepper Punisher",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["Mature cheddar slices",1,"each"],["Mushrooms",50,"g"],["Caramelised onions",30,"g"],["Crispy shallots",15,"g"],["Double cream",30,"ml"],["Dijon mustard",5,"ml"],["Cracked black pepper",2,"g"],["Concentrated beef stock",5,"ml"]],method:"Smash and cook the beef patties. Sauté mushrooms; warm cream, Dijon, pepper and beef stock into a sauce. Add cheddar, onions, shallots and peppercorn sauce."},

{name:"The Smoke Show",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["Smoked cheddar slices",1,"each"],["Cooked brisket burnt ends",60,"g"],["Pickled red onion",25,"g"],["Crispy onions",15,"g"],["BBQ sauce",45,"ml"],["Brown sugar",5,"g"],["Smoked paprika",1,"g"],["Cider vinegar",5,"ml"]],method:"Warm the cooked burnt ends separately. Mix BBQ sauce, sugar, paprika and vinegar. Smash the patties and finish with smoked cheddar, burnt ends, pickled onion, crispy onions and glaze."},
{name:"The Seoul Destroyer",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["American cheese slices",1,"each"],["Sesame slaw",50,"g"],["Pickled cucumber",30,"g"],["Crispy onions",15,"g"],["Mayonnaise",30,"ml"],["Gochujang",15,"g"],["Honey",5,"ml"],["Soy sauce",5,"ml"],["Rice vinegar",5,"ml"],["Sesame oil",1.25,"ml"]],method:"Mix the gochujang mayo. Smash and cook patties, melt cheese and serve with sesame slaw, cucumber and crispy onions."},
{name:"The Blue Beast",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["Blue cheese",35,"g"],["Smoked streaky bacon",3,"rashers"],["Onions",35,"g"],["Brown sugar",5,"g"],["Balsamic vinegar",5,"ml"],["Rocket",15,"g"],["Mayonnaise",30,"ml"],["Roasted garlic",3,"g"],["Lemon juice",5,"ml"]],method:"Fry two bacon rashers with onions, sugar and balsamic to make jam; crisp the remaining bacon. Smash patties, add blue cheese, rocket, bacon jam and garlic mayo."},
{name:"The Sweet Heat Freak",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["American cheese slices",1,"each"],["Candied jalapeños",25,"g"],["Smoked streaky bacon",2,"rashers"],["Dill pickle slices",3,"each"],["Mayonnaise",30,"ml"],["Chipotle paste",5,"g"],["Lime juice",5,"ml"],["Honey",30,"ml"],["Chilli flakes",0.5,"g"]],method:"Mix chipotle mayo and hot honey. Smash patties, melt cheese and layer with crisp bacon, jalapeños, pickles and sauces."},
{name:"The Morning After",items:[["Chuck mince",75,"g"],["Brisket mince",37.5,"g"],["Short rib mince",37.5,"g"],["Brioche buns",1,"each"],["American cheese slices",1,"each"],["Smoked streaky bacon",2,"rashers"],["Hash browns",1,"each"],["Eggs",1,"each"],["Caramelised onions",30,"g"],["Mayonnaise",30,"ml"],["Maple syrup",5,"ml"],["Chipotle paste",2.5,"g"],["American mustard",2.5,"ml"]],method:"Cook the hash brown, bacon and fried egg. Smash patties and add cheese. Mix maple-chipotle mayo, then stack with onions, hash brown, bacon and egg."},
{name:"The Surf Monster",items:[["Chuck mince",80,"g"],["Brisket mince",35,"g"],["Short rib mince",35,"g"],["Skinless salmon fillet",35,"g"],["Brioche buns",1,"each"],["Mature cheddar slices",1,"each"],["Smoked streaky bacon",2,"rashers"],["Peeled king prawns",40,"g"],["Garlic",1,"cloves"],["Pickled red onion",25,"g"],["Crispy shallots",15,"g"],["Shredded lettuce",20,"g"],["Mayonnaise",45,"ml"],["Dijon mustard",2.5,"ml"],["Lemon juice",5,"ml"],["Fresh dill",2,"g"],["Roasted garlic",3,"g"]],method:"Finely mince and combine the salmon with the beef. Keep chilled and cook the mixed patty thoroughly to 75°C at the centre. Cook prawns separately with garlic. Assemble with cheese, bacon, prawns, salad and lemon-dill mayo."},

function qty(n){return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}
function counts(){return saved('gf-burger-counts',Array(10).fill(0))}
function totals(cs){const out=new Map();burgerSpecs.forEach((b,i)=>{const n=Number(cs[i])||0;if(n<=0)return;b.items.forEach(([name,q,unit])=>{const k=name+'|'+unit;let x=out.get(k)||{name,unit,amount:0};x.amount+=q*n;out.set(k,x)})});return [...out.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function shoppingText(cs){let total=cs.reduce((a,b)=>a+(Number(b)||0),0);return 'GATHER & FLAME — BURGER SHOPPING LIST\n'+total+' burgers\n\n'+burgerSpecs.map((b,i)=>cs[i]>0?b.name+': '+cs[i]:'').filter(Boolean).join('\n')+'\n\n'+totals(cs).map(x=>'☐ '+x.name+': '+qty(x.amount)+' '+x.unit).join('\n')+'\n\nQuantities are recipe estimates. Allow extra for waste and serving preferences.'}
function burgerView(){let cs=counts();return '<h2>Signature Burger Lab</h2><p>Complete ingredients, per-burger amounts and cooking instructions. All quantities below are for <strong>one burger</strong>.</p><p class="muted">Standard burgers 1–8 use 150g beef: 75g chuck, 37.5g brisket and 37.5g short rib. Meat and topping weights are raw/purchase estimates unless marked cooked.</p><div class="grid">'+burgerSpecs.map((b,i)=>'<article class="card"><span class="tag">Burger '+(i+1)+'</span><h3>'+safe(b.name)+'</h3><details><summary>Full ingredients ('+b.items.length+')</summary><ul>'+b.items.map(x=>'<li>'+safe(x[0])+': '+qty(x[1])+' '+safe(x[2])+'</li>').join('')+'</ul></details><details><summary>How to make it</summary><p>'+safe(b.method)+'</p></details><p><button data-planburger="'+i+'">Add to party planner</button></p></article>').join('')+'</div><p class="muted">Season patties with salt just before cooking. Use food-safe handling and suitable cooking temperatures.</p>'}
function plannerView(){const cs=counts();const t=totals(cs);return '<h2>Burger Party Planner</h2><p>Enter how many of each burger you want. Your combined shopping list updates automatically, with shared ingredients added together.</p><div class="grid">'+burgerSpecs.map((b,i)=>'<div class="card"><label for="burgerqty'+i+'">'+safe(b.name)+'</label><input id="burgerqty'+i+'" data-burgerqty="'+i+'" type="number" min="0" max="10000" step="1" value="'+(cs[i]||0)+'"></div>').join('')+'</div><div class="card" style="margin-top:20px"><h3 id="burger-total">Total: '+cs.reduce((a,b)=>a+(Number(b)||0),0)+' burgers</h3><div class="row"><button id="copy-shopping">Copy shopping list</button><button id="print-shopping">Print shopping list</button><button id="clear-shopping">Clear quantities</button></div><p id="shopping-msg" class="muted"></p><div id="shopping-results">'+(t.length?'<ul>'+t.map(x=>'<li><label><input type="checkbox" style="width:auto;margin:0 10px 0 0"> '+safe(x.name)+' — '+qty(x.amount)+' '+safe(x.unit)+'</label></li>').join('')+'</ul>':'<p>Choose burger quantities above to build your list.</p>')+'</div></div><p class="muted">Amounts are based on the recipes shown in Burger Lab. Allow a little extra for waste, substitutions and portion preferences. The checklist ticks are temporary; burger quantities are saved on this device.</p>'}
const originalRender=render;
render=function(){if(tab==='Burger Lab'||tab==='Party Planner'){nav();$('#app').innerHTML=tab==='Burger Lab'?burgerView():plannerView();if(tab==='Burger Lab'){document.querySelectorAll('[data-planburger]').forEach(b=>b.onclick=()=>{let cs=counts();cs[Number(b.dataset.planburger)]++;store('gf-burger-counts',cs);tab='Party Planner';render()})}else{document.querySelectorAll('[data-burgerqty]').forEach(el=>el.oninput=()=>{let cs=counts();cs[Number(el.dataset.burgerqty)]=Math.min(10000,Math.max(0,Math.floor(Number(el.value)||0)));store('gf-burger-counts',cs);let t=totals(cs);$('#burger-total').textContent='Total: '+cs.reduce((a,b)=>a+(Number(b)||0),0)+' burgers';$('#shopping-results').innerHTML=t.length?'<ul>'+t.map(x=>'<li><label><input type="checkbox" style="width:auto;margin:0 10px 0 0"> '+safe(x.name)+' — '+qty(x.amount)+' '+safe(x.unit)+'</label></li>').join('')+'</ul>':'<p>Choose burger quantities above to build your list.</p>'});$('#copy-shopping').onclick=()=>{const s=shoppingText(counts());if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>$('#shopping-msg').textContent='Copied ✓').catch(()=>$('#shopping-msg').textContent='Copy unavailable in this browser. Use Print instead.')}else $('#shopping-msg').textContent='Copy unavailable in this browser. Use Print instead.'};$('#print-shopping').onclick=()=>{let w=window.open('','_blank');if(!w){$('#shopping-msg').textContent='Allow pop-ups to print.';return}let pre=w.document.createElement('pre');pre.textContent=shoppingText(counts());pre.style.cssText='font:16px/1.7 system-ui;white-space:pre-wrap;padding:25px';w.document.body.appendChild(pre);w.document.title='Gather & Flame Shopping List';w.print()};$('#clear-shopping').onclick=()=>{store('gf-burger-counts',Array(10).fill(0));render()}}return}originalRender()};
render();
</script>

{mix:["Chuck mince","Brisket mince","Short rib mince"],sauce:["BBQ sauce","Brown sugar","Smoked paprika","Cider vinegar"]},

];
function burgerSections(i){const b=burgerSpecs[i],g=burgerGroups[i];const mix=b.items.filter(x=>g.mix.includes(x[0]));const sauce=b.items.filter(x=>g.sauce.includes(x[0]));const toppings=b.items.filter(x=>!g.mix.includes(x[0])&&!g.sauce.includes(x[0]));const section=(title,items)=>'<h4 style="color:#eac090;margin-bottom:5px">'+title+'</h4><ul style="margin-top:5px">'+items.map(x=>'<li>'+safe(x[0])+': '+qty(x[1])+' '+safe(x[2])+'</li>').join('')+'</ul>';return section('🥩 Burger meat mix',mix)+section('🥬 Buns & toppings',toppings)+section('🥣 Signature sauce ingredients',sauce)+(i===5?'<p class="muted">For bacon-onion jam, cook two of the listed bacon rashers with onions, brown sugar and balsamic.</p>':'')+(i===9?'<p class="muted">The listed edible bone marrow is used across the burger mix and sauce; do not purchase it twice.</p>':'')}
function singleShopping(i,n){const b=burgerSpecs[i];return 'GATHER & FLAME\n'+b.name.toUpperCase()+'\nFor '+n+' burger'+(n===1?'':'s')+'\n\n'+b.items.map(x=>'☐ '+x[0]+': '+qty(x[1]*n)+' '+x[2]).join('\n')+'\n\nMix and sauce quantities are estimates; adjust seasoning to taste.'}
burgerView=function(){return '<h2>Signature Burger Lab</h2><p>Each burger has its own meat mix, toppings, sauce recipe and individual shopping list. Quantities are shown per burger; enter a number to scale them.</p><div class="grid">'+burgerSpecs.map((b,i)=>'<article class="card"><span class="tag">Burger '+(i+1)+'</span><h3>'+safe(b.name)+'</h3><details><summary>Full recipe — meat, toppings & sauce</summary>'+burgerSections(i)+'<h4 style="color:#eac090">👨‍🍳 Cooking instructions</h4><p>'+safe(b.method)+'</p></details><label>How many '+safe(b.name)+' burgers?<input data-singleqty="'+i+'" type="number" min="1" max="10000" step="1" value="1"></label><details data-single-list="'+i+'"><summary>Individual shopping list</summary><div data-single-items="'+i+'"></div></details><div class="row"><button data-copy-single="'+i+'">Copy list</button><button data-planburger="'+i+'">Add 1 to party planner</button></div><p class="muted" data-single-msg="'+i+'"></p></article>').join('')+'</div><p class="muted">Cook meat safely, avoid cross-contamination and adjust seasoning to taste. The Surf Monster combines raw salmon and beef and must reach 75°C at the centre.</p>'};
const renderBeforeSingle=render;
render=function(){renderBeforeSingle();if(tab!=='Burger Lab')return;function show(i){const el=document.querySelector('[data-singleqty="'+i+'"]');const n=Math.max(1,Math.min(10000,Math.floor(Number(el.value)||1)));const g=burgerGroups[i],b=burgerSpecs[i];const section=(title,arr)=>'<h4>'+title+'</h4><ul>'+arr.map(x=>'<li><label><input type="checkbox" style="width:auto;margin:0 8px 0 0">'+safe(x[0])+' — '+qty(x[1]*n)+' '+safe(x[2])+'</label></li>').join('')+'</ul>';document.querySelector('[data-single-items="'+i+'"]').innerHTML='<p><strong>For '+n+' burger'+(n===1?'':'s')+'</strong></p>'+section('Burger mix',b.items.filter(x=>g.mix.includes(x[0])))+section('Toppings & buns',b.items.filter(x=>!g.mix.includes(x[0])&&!g.sauce.includes(x[0])))+section('Sauce ingredients',b.items.filter(x=>g.sauce.includes(x[0])))}
document.querySelectorAll('[data-singleqty]').forEach(el=>{const i=Number(el.dataset.singleqty);show(i);el.oninput=()=>show(i)});
document.querySelectorAll('[data-copy-single]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.copySingle),n=Math.max(1,Math.min(10000,Math.floor(Number(document.querySelector('[data-singleqty="'+i+'"]').value)||1)));const msg=document.querySelector('[data-single-msg="'+i+'"]');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(singleShopping(i,n)).then(()=>msg.textContent='Shopping list copied ✓').catch(()=>msg.textContent='Copy not available in this browser');else msg.textContent='Copy not available in this browser'});
document.querySelectorAll('[data-planburger]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.planburger),n=Math.max(1,Math.min(10000,Math.floor(Number(document.querySelector('[data-singleqty="'+i+'"]').value)||1)));let cs=counts();cs[i]=Math.min(10000,(Number(cs[i])||0)+n);store('gf-burger-counts',cs);tab='Party Planner';render()});

<script>
/* Gather & Flame: selected menu, additions and bulk sauce production */
const menuExtras=[
["Extra American cheese", "American cheese slices",1,"each"],
["Extra mature cheddar", "Mature cheddar slices",1,"each"],
["Extra smoked bacon", "Smoked streaky bacon",2,"rashers"],
["Extra pickles", "Dill pickle slices",4,"each"],
["Extra caramelised onions", "Caramelised onions",30,"g"],
["Extra jalapeños", "Candied jalapeños",25,"g"],
["Extra mushrooms", "Mushrooms",50,"g"],
["Chips portion", "Chips (frozen or prepared)",200,"g"],
["Sweet potato fries portion", "Sweet potato fries",200,"g"],
["Side salad portion", "Mixed salad ingredients",100,"g"],
["Garlic bread portion", "Garlic bread",1,"portion"]
];
const sauceNames=["House burger sauce","Creamy peppercorn sauce","Truffle mayonnaise","Smoky BBQ glaze","Gochujang mayonnaise","Roasted garlic mayonnaise","Chipotle mayo & hot honey","Maple-chipotle mayonnaise","Lemon-dill mayonnaise","Bone marrow peppercorn sauce"];
function menuState(){const v=saved('gf-selected-menu',null);return v&&Array.isArray(v.burgers)&&Array.isArray(v.extras)?v:{burgers:Array(10).fill(0),extras:Array(menuExtras.length).fill(0),sauceExtra:Array(10).fill(0),sauceBatch:Array(10).fill(0)}}
function groupRows(i){const b=burgerSpecs[i],g=burgerGroups[i];return {mix:b.items.filter(x=>g.mix.includes(x[0])),sauce:b.items.filter(x=>g.sauce.includes(x[0])),other:b.items.filter(x=>!g.mix.includes(x[0])&&!g.sauce.includes(x[0]))}}
function combinedMenu(s){const groups={mix:new Map(),other:new Map(),sauce:new Map(),extras:new Map()};const add=(group,name,q,unit)=>{let key=name+'|'+unit,old=groups[group].get(key)||{name,unit,amount:0};old.amount+=q;groups[group].set(key,old)};
burgerSpecs.forEach((b,i)=>{let n=Number(s.burgers[i])||0,extra=Number(s.sauceExtra?.[i])||0,batch=Number(s.sauceBatch?.[i])||0,r=groupRows(i);r.mix.forEach(x=>add('mix',x[0],x[1]*n,x[2]));r.other.forEach(x=>add('other',x[0],x[1]*n,x[2]));r.sauce.forEach(x=>add('sauce',x[0],x[1]*(n+extra+batch),x[2]))});
menuExtras.forEach((e,i)=>{let n=Number(s.extras[i])||0;if(n)add('extras',e[1],e[2]*n,e[3])});return Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,[...v.values()].filter(x=>x.amount>0).sort((a,b)=>a.name.localeCompare(b.name))]))}
function menuText(s){let groups=combinedMenu(s),out=['GATHER & FLAME — SELECTED MENU','',...burgerSpecs.map((b,i)=>s.burgers[i]>0?b.name+': '+s.burgers[i]:'').filter(Boolean),'',...menuExtras.map((e,i)=>s.extras[i]>0?e[0]+': '+s.extras[i]:'').filter(Boolean),''];for(const [key,title] of [['mix','MEAT MIXES'],['other','BUNS & TOPPINGS'],['sauce','BULK SAUCE INGREDIENTS'],['extras','ADDITIONAL EXTRAS & SIDES']]){out.push(title);out.push(...groups[key].map(x=>'☐ '+x.name+' — '+qty(x.amount)+' '+x.unit));out.push('')}return out.join('\n')}
function menuPage(){const s=menuState(),total=s.burgers.reduce((a,b)=>a+(Number(b)||0),0);return '<section class="hero"><h2>Build Your Menu</h2><p>Choose your burgers, extras and sides. Then calculate everything to buy — including the ingredients to make signature sauces in bulk.</p></section><h2>1. Select burgers</h2><div class="grid">'+burgerSpecs.map((b,i)=>'<div class="card"><h3>'+safe(b.name)+'</h3><label>Number of burgers<input data-menu-burger="'+i+'" type="number" min="0" max="10000" step="1" value="'+(s.burgers[i]||0)+'"></label><p class="muted">Sauce: '+safe(sauceNames[i])+'</p></div>').join('')+'</div><h2>2. Add extras and sides</h2><div class="grid">'+menuExtras.map((e,i)=>'<div class="card"><label>'+safe(e[0])+'<input data-menu-extra="'+i+'" type="number" min="0" max="10000" step="1" value="'+(s.extras[i]||0)+'"></label><p class="muted">Each adds '+qty(e[2])+' '+safe(e[3])+'</p></div>').join('')+'</div><h2>3. Make sauces in bulk</h2><p>The sauce for each selected burger is included automatically. Enter extra sauce servings to make for dipping or serving separately, or add a standalone batch even when you are not making that burger.</p><div class="grid">'+burgerSpecs.map((b,i)=>'<div class="card"><h3>'+safe(sauceNames[i])+'</h3><p class="muted">For '+(s.burgers[i]||0)+' selected burgers</p><label>Extra servings for dipping<input data-menu-sauceextra="'+i+'" type="number" min="0" max="10000" step="1" value="'+(s.sauceExtra?.[i]||0)+'"></label><label>Additional standalone sauce servings<input data-menu-saucebatch="'+i+'" type="number" min="0" max="10000" step="1" value="'+(s.sauceBatch?.[i]||0)+'"></label><details><summary>Bulk sauce ingredients</summary><div data-menu-sauce-list="'+i+'"></div></details></div>').join('')+'</div><h2>4. Your shopping list</h2><div class="card"><h3 id="menu-total">'+total+' burgers selected</h3><div class="row"><button id="menu-copy">Copy shopping list</button><button id="menu-print">Print</button><button id="menu-clear">Clear menu</button></div><p id="menu-message" class="muted"></p><div id="menu-shopping"></div></div><p class="muted">All amounts are estimated recipe quantities, not supermarket pack sizes. Allow extra for preparation waste. Sauces are scaled by servings, and very small spice amounts may need rounding up for accurate measuring.</p>'}
function menuRefresh(){const s=menuState(),g=combinedMenu(s);$('#menu-total').textContent=s.burgers.reduce((a,b)=>a+(Number(b)||0),0)+' burgers selected';const block=(title,items)=>'<h3>'+title+'</h3>'+(items.length?'<ul>'+items.map(x=>'<li><label><input type="checkbox" style="width:auto;margin:0 8px 0 0">'+safe(x.name)+' — '+qty(x.amount)+' '+safe(x.unit)+'</label></li>').join('')+'</ul>':'<p class="muted">No items selected</p>');$('#menu-shopping').innerHTML=block('🥩 Meat mixes',g.mix)+block('🍔 Buns & toppings',g.other)+block('🥣 Ingredients for bulk sauces',g.sauce)+block('🍟 Extras & sides',g.extras);
burgerSpecs.forEach((b,i)=>{let servings=(Number(s.burgers[i])||0)+(Number(s.sauceExtra?.[i])||0)+(Number(s.sauceBatch?.[i])||0);const sauce=groupRows(i).sauce;const el=document.querySelector('[data-menu-sauce-list="'+i+'"]');if(el)el.innerHTML='<p>For '+servings+' sauce servings:</p><ul>'+sauce.map(x=>'<li>'+safe(x[0])+': '+qty(x[1]*servings)+' '+safe(x[2])+'</li>').join('')+'</ul>'})}
const renderBeforeMenu=render;
render=function(){if(tab!=='Build Your Menu')return renderBeforeMenu();nav();$('#app').innerHTML=menuPage();menuRefresh();
for(const [attr,key] of [['data-menu-burger','burgers'],['data-menu-extra','extras'],['data-menu-sauceextra','sauceExtra'],['data-menu-saucebatch','sauceBatch']]){document.querySelectorAll('['+attr+']').forEach(el=>el.oninput=()=>{const s=menuState(),i=Number(el.getAttribute(attr));s[key][i]=Math.max(0,Math.min(10000,Math.floor(Number(el.value)||0)));store('gf-selected-menu',s);menuRefresh()})}
$('#menu-copy').onclick=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(menuText(menuState())).then(()=>$('#menu-message').textContent='Shopping list copied ✓').catch(()=>$('#menu-message').textContent='Copy unavailable');else $('#menu-message').textContent='Copy unavailable'};
$('#menu-print').onclick=()=>{const w=window.open('','_blank');if(!w){$('#menu-message').textContent='Allow pop-ups to print';return}const p=w.document.createElement('pre');p.textContent=menuText(menuState());p.style.cssText='font:16px/1.7 system-ui;white-space:pre-wrap;padding:24px';w.document.body.appendChild(p);w.document.title='Gather & Flame Menu Shopping List';w.print()};
$('#menu-clear').onclick=()=>{store('gf-selected-menu',{burgers:Array(10).fill(0),extras:Array(menuExtras.length).fill(0),sauceExtra:Array(10).fill(0),sauceBatch:Array(10).fill(0)});render()};
};
tabs.splice(3,0,'Build Your Menu');
render();
</script>
